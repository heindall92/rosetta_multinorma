name: Publicar en GitHub Pages

# Cada push a la rama por defecto reconstruye dist/, pasa las pruebas y publica el resultado
# en la rama gh-pages, que GitHub Pages sirve en https://heindall92.github.io/rosetta_multinorma/
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - run: node --test tests/engine.test.mjs tests/catalog.test.mjs tests/build.test.mjs
      - name: Publicar dist/ en gh-pages
        env:
          SHA: ${{ github.sha }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
